name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium for Playwright tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then python -m playwright install --with-deps chromium; else python -m playwright install chromium; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install JMeter for performance tests (checksum verified)
        shell: bash
        run: |
          v=5.6.3
          # archive.apache.org often resets or times out from the runners: retry, then try the Apache CDN
          fetch() {
            for base in https://archive.apache.org/dist https://dlcdn.apache.org; do
              curl -sSfL --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 30 -o "$2" "$base/jmeter/binaries/$1" && return 0
            done
            return 1
          }
          fetch "apache-jmeter-$v.tgz" jmeter.tgz
          fetch "apache-jmeter-$v.tgz.sha512" jmeter.sha512
          echo "$(cut -d' ' -f1 jmeter.sha512)  jmeter.tgz" | sha512sum -c -
          dest="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")"  # Git Bash tar reads "D:" as a remote host
          tar -xzf jmeter.tgz -C "$dest"
          echo "JMETER_HOME=$RUNNER_TEMP/apache-jmeter-$v" >> "$GITHUB_ENV"
      - run: python -m pytest -q
  security-audit:
    # Fails the build when a bundled Python package has a known vulnerability (PyPI advisory database / OSV),
    # before the package reaches a company security scan.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit the exact packages bundled in the offline package
        run: pip-audit --strict --no-deps --disable-pip -r packaging/requirements-offline-win.txt
      - name: Audit the Faster-Whisper packages bundled in the offline package
        run: pip-audit --strict --no-deps --disable-pip -r packaging/requirements-faster-whisper-win.txt
  offline-package:
    # Builds the portable package exactly as a user would, validates it with the network blocked,
    # installs it per-user (no administrator rights) and validates the installed copy.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: dist_offline/downloads
          key: offline-downloads-${{ hashFiles('packaging/offline-lock.json') }}
      - name: Build the offline package (validates it at the end)
        env:
          QA_NO_PAUSE: "1"
        run: python packaging/build_offline_package.py --zip
      - name: Install to a temporary folder and validate the installed copy
        shell: cmd
        env:
          QA_NO_PAUSE: "1"
        run: |
          for /d %%P in (dist_offline\SGQA) do set "PKG=%%P"
          call "%PKG%\INSTALL.cmd" --target "%RUNNER_TEMP%\qa-install" --no-shortcuts || exit /b 1
          call "%RUNNER_TEMP%\qa-install\VALIDATE_OFFLINE.cmd" || exit /b 1
          type "%RUNNER_TEMP%\qa-install\logs\validation-latest.txt"
      - name: Publish the package for download (Actions run page, Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: SGQA-windows
          path: dist_offline/SGQA/
          retention-days: 14
          compression-level: 6
          # Bundled JMeter and Python packages contain dot-files that MANIFEST.json lists; without them the
          # installer rightly reports the package as damaged.
          include-hidden-files: true
      - name: Publish the zip, its checksum and the SBOM (hand these to the security team)
        uses: actions/upload-artifact@v4
        with:
          name: SGQA-windows-zip
          path: |
            dist_offline/SGQA-*.zip
            dist_offline/SHA256SUMS.txt
            dist_offline/SGQA/sbom.cdx.json
          retention-days: 14
          compression-level: 0
  offline-package-download:
    # Proves the artifact people download installs: fetch it the way a user would, on a fresh runner, then
    # validate and install it.
    needs: offline-package
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SGQA-windows
          path: downloaded/SGQA
      - name: Validate and install the downloaded package
        shell: cmd
        env:
          QA_NO_PAUSE: "1"
        run: |
          rem The artifact holds the contents of the SGQA folder, as a user sees it after Extract All.
          for /d %%P in ("%CD%\downloaded\SGQA") do set "PKG=%%~fP"
          if not defined PKG (echo No package folder in the download & dir /b downloaded & exit /b 1)
          call "%PKG%\VALIDATE.cmd" || exit /b 1
          call "%PKG%\INSTALL.cmd" --target "%RUNNER_TEMP%\qa-install" --no-shortcuts || exit /b 1
          type "%RUNNER_TEMP%\qa-install\logs\validation-latest.txt"
  setup-exe-build:
    # 23.10.0: builds the cumulative patch and the Setup wizard exactly as released (NSIS, per user), for the
    # Windows job below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install NSIS
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - name: Download the pinned OCR runtime wheels (hash-checked)
        run: |
          python -m pip download --no-deps --require-hashes --only-binary=:all: --platform win_amd64 --python-version 3.13 \
            --implementation cp -d ocr-wheels -r packaging/setup/ocr-wheels.txt
      - name: Build the patch and Setup.exe
        run: python packaging/setup/build_release.py --out dist_release --ocr-wheels ocr-wheels --skip-extension
      - uses: actions/upload-artifact@v4
        with:
          name: SGQA-23.10.0-setup
          path: |
            dist_release/SkyGuard_SGQA-23.3.35_to_Latest_Cumulative_Patch/SkyGuard_SGQA-23.3.35_to_Latest_Offline_Setup.exe
            dist_release/SkyGuard_SGQA-23.3.35_to_Latest_Cumulative_Patch/Manual_Install/
          retention-days: 7
          compression-level: 0
  setup-exe-windows:
    # Runs the Setup wizard unattended on Windows (Windows PowerShell 5.1, a standard runner account) over real
    # 23.3.35 and 23.9.0 installations, checks the result, verifies, rolls back, refuses an unsupported version,
    # and runs the manual APPLY_PATCH.ps1 with Windows PowerShell 5.1.
    needs: setup-exe-build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        baseline: ["23.3.35:6d448fa", "23.9.0:33b3a50"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: SGQA-23.10.0-setup
          path: rel
      - name: Install the baseline release (its own code, a virtual environment, a database with data)
        shell: pwsh
        run: |
          $v, $c = "${{ matrix.baseline }}".Split(":")
          $inst = Join-Path $env:RUNNER_TEMP "inst"
          New-Item -ItemType Directory -Force "$inst\app", "$inst\data" | Out-Null
          git archive --format=zip -o "$env:RUNNER_TEMP\rel.zip" $c qa_platform web skyguard_agent requirements.txt
          Expand-Archive "$env:RUNNER_TEMP\rel.zip" "$inst\app"
          '{"installed": true}' | Set-Content "$inst\app\INSTALLED.json"
          python -m venv "$inst\app\.venv"
          & "$inst\app\.venv\Scripts\python.exe" -m pip install -q -r "$inst\app\requirements.txt"
          $env:QA_HOME = "$inst\data"
          & "$inst\app\.venv\Scripts\python.exe" -c "import sys; sys.path.insert(0, r'$inst\app'); from qa_platform.config import Paths; from qa_platform.storage.db import Database; d = Database(Paths().ensure().db_file); print('installed', d.query_one('SELECT MAX(version) AS v FROM schema_version')['v']); d.close()"
          "INST=$inst" | Out-File -Append $env:GITHUB_ENV
          "BASEV=$v" | Out-File -Append $env:GITHUB_ENV
      - name: Setup.exe refuses a version that is not supported, and changes nothing
        shell: pwsh
        run: |
          $init = "$env:INST\app\qa_platform\__init__.py"
          $orig = Get-Content $init -Raw
          ($orig -replace '__version__ = "[^"]+"', '__version__ = "23.3.31"') | Set-Content $init -NoNewline
          $exe = Get-ChildItem rel -Recurse -Filter "*Offline_Setup.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "/S", "/APP=$env:INST", "/NOSTART" -Wait -PassThru
          "exit code $($p.ExitCode)"
          if ($p.ExitCode -ne 3) { throw "expected exit code 3 (not supported), got $($p.ExitCode)" }
          if ((Get-Content $init -Raw) -notmatch '23.3.31') { throw "the version file was changed" }
          if (Test-Path "$env:INST\patch-backups") { throw "a backup was made for an unsupported version" }
          $orig | Set-Content $init -NoNewline
      - name: Setup.exe upgrades and verifies (unattended)
        shell: pwsh
        run: |
          $exe = Get-ChildItem rel -Recurse -Filter "*Offline_Setup.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "/S", "/APP=$env:INST", "/NOSTART" -Wait -PassThru
          Get-ChildItem "$env:INST\logs\setup-23.10.0-*.txt" | ForEach-Object { Get-Content $_.FullName }
          "exit code $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Setup failed with exit code $($p.ExitCode)" }
          if ((Get-Content "$env:INST\app\qa_platform\__init__.py" -Raw) -notmatch '"23.10.0"') { throw "version is not 23.10.0" }
          if (-not (Test-Path "$env:INST\patch-tools\23.10.0\ROLLBACK_PATCH.cmd")) { throw "patch-tools missing" }
          $env:QA_HOME = "$env:INST\data"
          & "$env:INST\app\.venv\Scripts\python.exe" -E -s "$env:INST\patch-tools\23.10.0\install_patch.py" verify --app "$env:INST" --python "$env:INST\app\.venv\Scripts\python.exe"
          if ($LASTEXITCODE -ne 0) { throw "verify failed" }
      - name: Roll back to the baseline, then upgrade again with APPLY_PATCH.ps1 (Windows PowerShell 5.1)
        shell: pwsh
        run: |
          $env:QA_HOME = "$env:INST\data"
          & "$env:INST\app\.venv\Scripts\python.exe" -E -s "$env:INST\patch-tools\23.10.0\install_patch.py" rollback --app "$env:INST" --skip-running-check
          if ($LASTEXITCODE -ne 0) { throw "rollback failed" }
          if ((Get-Content "$env:INST\app\qa_platform\__init__.py" -Raw) -notmatch [regex]::Escape("""$env:BASEV""")) { throw "rollback did not restore $env:BASEV" }
          $manual = Get-ChildItem rel -Recurse -Directory -Filter "Manual_Install" | Select-Object -First 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$($manual.FullName)\APPLY_PATCH.ps1" -InstallDir "$env:INST" -NoStart
          if ($LASTEXITCODE -ne 0) { throw "APPLY_PATCH.ps1 failed" }
          if ((Get-Content "$env:INST\app\qa_platform\__init__.py" -Raw) -notmatch '"23.10.0"') { throw "version is not 23.10.0 after APPLY_PATCH.ps1" }
