name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium for Playwright tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then python -m playwright install --with-deps chromium; else python -m playwright install chromium; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install JMeter for performance tests (checksum verified)
        shell: bash
        run: |
          v=5.6.3
          curl -sSfL -o jmeter.tgz "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-$v.tgz"
          echo "$(curl -sSfL "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-$v.tgz.sha512" | cut -d' ' -f1)  jmeter.tgz" | sha512sum -c -
          dest="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")"  # Git Bash tar reads "D:" as a remote host
          tar -xzf jmeter.tgz -C "$dest"
          echo "JMETER_HOME=$RUNNER_TEMP/apache-jmeter-$v" >> "$GITHUB_ENV"
      - run: python -m pytest -q
  offline-package:
    # Builds the portable package exactly as a user would, validates it with the network blocked,
    # installs it per-user (no administrator rights) and validates the installed copy.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: dist_offline/downloads
          key: offline-downloads-${{ hashFiles('packaging/offline-lock.json') }}
      - name: Build the offline package (validates it at the end)
        env:
          QA_NO_PAUSE: "1"
        run: python packaging/build_offline_package.py --zip
      - name: Install to a temporary folder and validate the installed copy
        shell: cmd
        env:
          QA_NO_PAUSE: "1"
        run: |
          for /d %%P in (dist_offline\AIAgenticTestAgent-Offline-*) do set "PKG=%%P"
          call "%PKG%\INSTALL_OFFLINE.cmd" --target "%RUNNER_TEMP%\qa-install" --no-shortcuts || exit /b 1
          call "%RUNNER_TEMP%\qa-install\VALIDATE_OFFLINE.cmd" || exit /b 1
          type "%RUNNER_TEMP%\qa-install\logs\validation-latest.txt"
      - name: Publish the package for download (Actions run page, Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: AIAgenticTestAgent-Offline-windows
          path: dist_offline/AIAgenticTestAgent-Offline-*/
          retention-days: 14
          compression-level: 6
          # Bundled JMeter and Python packages contain dot-files that MANIFEST.json lists; without them the
          # installer rightly reports the package as damaged.
          include-hidden-files: true
  offline-package-download:
    # Proves the artifact people download installs: fetch it the way a user would, on a fresh runner, then
    # validate and install it.
    needs: offline-package
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AIAgenticTestAgent-Offline-windows
          path: downloaded
      - name: Validate and install the downloaded package
        shell: cmd
        env:
          QA_NO_PAUSE: "1"
        run: |
          call "%CD%\downloaded\VALIDATE_OFFLINE.cmd" || exit /b 1
          call "%CD%\downloaded\INSTALL_OFFLINE.cmd" --target "%RUNNER_TEMP%\qa-install" --no-shortcuts || exit /b 1
          type "%RUNNER_TEMP%\qa-install\logs\validation-latest.txt"
