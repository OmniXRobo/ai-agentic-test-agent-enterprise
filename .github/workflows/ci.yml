name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium for Playwright tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then python -m playwright install --with-deps chromium; else python -m playwright install chromium; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install JMeter for performance tests (checksum verified)
        shell: bash
        run: |
          v=5.6.3
          # archive.apache.org often resets or times out from the runners: retry, then try the Apache CDN
          fetch() {
            for base in https://archive.apache.org/dist https://dlcdn.apache.org; do
              curl -sSfL --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 30 -o "$2" "$base/jmeter/binaries/$1" && return 0
            done
            return 1
          }
          fetch "apache-jmeter-$v.tgz" jmeter.tgz
          fetch "apache-jmeter-$v.tgz.sha512" jmeter.sha512
          echo "$(cut -d' ' -f1 jmeter.sha512)  jmeter.tgz" | sha512sum -c -
          dest="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")"  # Git Bash tar reads "D:" as a remote host
          tar -xzf jmeter.tgz -C "$dest"
          echo "JMETER_HOME=$RUNNER_TEMP/apache-jmeter-$v" >> "$GITHUB_ENV"
      - run: python -m pytest -q
  security-audit:
    # Fails the build when a bundled Python package has a known vulnerability (PyPI advisory database / OSV),
    # before the package reaches a company security scan.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit the exact packages bundled in the offline package
        run: pip-audit --strict --no-deps --disable-pip -r packaging/requirements-offline-win.txt
      - name: Audit the Faster-Whisper packages bundled in the offline package
        run: pip-audit --strict --no-deps --disable-pip -r packaging/requirements-faster-whisper-win.txt
  offline-package:
    # Builds the portable package exactly as a user would, validates it with the network blocked,
    # installs it per-user (no administrator rights) and validates the installed copy.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: dist_offline/downloads
          key: offline-downloads-${{ hashFiles('packaging/offline-lock.json') }}
      - name: Build the offline package (validates it at the end)
        env:
          QA_NO_PAUSE: "1"
        run: python packaging/build_offline_package.py --zip
      - name: Install to a temporary folder and validate the installed copy
        shell: cmd
        env:
          QA_NO_PAUSE: "1"
        run: |
          for /d %%P in (dist_offline\SGQA) do set "PKG=%%P"
          call "%PKG%\INSTALL.cmd" --target "%RUNNER_TEMP%\qa-install" --no-shortcuts || exit /b 1
          call "%RUNNER_TEMP%\qa-install\VALIDATE_OFFLINE.cmd" || exit /b 1
          type "%RUNNER_TEMP%\qa-install\logs\validation-latest.txt"
      - name: "23.12.1: first install, repair over it, and the parts the 23.3.35 package lacked"
        # The reported failure: on a new Windows 11 PC the 23.3.35 INSTALL.cmd stopped with WinError 5 renaming
        # app.new to app. A first install now copies straight into app (no rename); here it starts with the app.new
        # the old installer left behind, then INSTALL.cmd runs again over it (repair: data backup, app.new -> app).
        shell: pwsh
        env:
          QA_NO_PAUSE: "1"
        run: |
          $pkg = (Resolve-Path dist_offline\SGQA).Path
          $t = Join-Path $env:RUNNER_TEMP "qa-fresh"
          New-Item -ItemType Directory -Force "$t\app.new\runtime" | Out-Null
          "left by the 23.3.35 installer" | Set-Content "$t\app.new\runtime\left.txt"
          cmd /c "`"$pkg\INSTALL.cmd`" --target `"$t`" --no-shortcuts"
          if ($LASTEXITCODE -ne 0) { throw "first install failed" }
          $log = Get-Content (Get-ChildItem "$t\logs\install-*.log" | Select-Object -Last 1).FullName -Raw
          $log
          if ($log -notmatch "Installing SkyGuard QA") { throw "not a first install" }
          if (Test-Path "$t\app.new") { throw "app.new left over" }
          if (Test-Path "$t\INSTALL_NOT_FINISHED.txt") { throw "marker left over" }
          if (-not (Test-Path "$t\app\skyguard_agent\__init__.py")) { throw "AI Agent module missing" }
          if (-not (Test-Path "$t\app\runtime\ocr\site-packages\rapidocr")) { throw "OCR runtime missing" }
          if (-not (Test-Path "$pkg\Browser_Extension\INSTALL.cmd")) { throw "browser extension missing" }
          $v = Get-Content (Get-ChildItem "$t\logs\validation-*.txt" | Sort-Object LastWriteTime | Select-Object -Last 1).FullName -Raw
          $v
          if ($v -notmatch "\[PASS\] Application modules") { throw "application modules check did not pass" }
          if ($v -notmatch "\[PASS\] Offline OCR runtime") { throw "OCR runtime check did not pass" }
          # data for the backup check
          & "$t\app\runtime\python\python.exe" -E -s -c "import sqlite3,sys; c=sqlite3.connect(sys.argv[1]); c.execute('CREATE TABLE IF NOT EXISTS ci_probe (x)'); c.execute('INSERT INTO ci_probe VALUES (7)'); c.commit()" "$t\data\qa_platform.sqlite3"
          cmd /c "`"$pkg\INSTALL.cmd`" --target `"$t`" --no-shortcuts"
          if ($LASTEXITCODE -ne 0) { throw "repair install failed" }
          Get-Content (Get-ChildItem "$t\logs\install-*.log" | Select-Object -Last 1).FullName
          if (-not (Test-Path "$t\app.previous\INSTALLED.json")) { throw "previous version not kept" }
          $b = Get-ChildItem "$t\backups" -Directory | Select-Object -First 1
          if (-not $b -or -not (Test-Path "$($b.FullName)\qa_platform.sqlite3")) { throw "data was not backed up" }
          if (Test-Path "$t\app.new") { throw "app.new left over after repair" }
      - name: Publish the package for download (Actions run page, Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: SGQA-windows
          path: dist_offline/SGQA/
          retention-days: 14
          compression-level: 6
          # Bundled JMeter and Python packages contain dot-files that MANIFEST.json lists; without them the
          # installer rightly reports the package as damaged.
          include-hidden-files: true
      - name: Publish the zip, its checksum and the SBOM (hand these to the security team)
        uses: actions/upload-artifact@v4
        with:
          name: SkyGuard_QA_Full_Offline_Installer
          path: |
            dist_offline/SkyGuard_QA_*_Full_Offline_Installer.zip
            dist_offline/SHA256SUMS.txt
            dist_offline/SGQA/sbom.cdx.json
          retention-days: 14
          compression-level: 0
  offline-package-download:
    # Proves the artifact people download installs: fetch it the way a user would, on a fresh runner, then
    # validate and install it.
    needs: offline-package
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SGQA-windows
          path: downloaded/SGQA
      - name: Validate and install the downloaded package
        shell: cmd
        env:
          QA_NO_PAUSE: "1"
        run: |
          rem The artifact holds the contents of the SGQA folder, as a user sees it after Extract All.
          for /d %%P in ("%CD%\downloaded\SGQA") do set "PKG=%%~fP"
          if not defined PKG (echo No package folder in the download & dir /b downloaded & exit /b 1)
          call "%PKG%\VALIDATE.cmd" || exit /b 1
          call "%PKG%\INSTALL.cmd" --target "%RUNNER_TEMP%\qa-install" --no-shortcuts || exit /b 1
          type "%RUNNER_TEMP%\qa-install\logs\validation-latest.txt"
  setup-exe-build:
    # 23.10.0 (now 23.14.1): builds the cumulative patch and the Setup wizard exactly as released (NSIS, per user), for the
    # Windows job below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install NSIS
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - name: Download the pinned OCR runtime wheels (hash-checked)
        run: |
          python -m pip download --no-deps --require-hashes --only-binary=:all: --platform win_amd64 --python-version 3.13 \
            --implementation cp -d ocr-wheels -r packaging/setup/ocr-wheels.txt
      - name: Build the patch and Setup.exe
        run: python packaging/setup/build_release.py --out dist_release --ocr-wheels ocr-wheels --skip-extension
      - uses: actions/upload-artifact@v4
        with:
          name: SGQA-23.14.1-setup
          path: |
            dist_release/SkyGuard_SGQA-23.3.35_to_Latest_Cumulative_Patch/SkyGuard_SGQA-23.3.35_to_Latest_Offline_Setup.exe
            dist_release/SkyGuard_SGQA-23.3.35_to_Latest_Cumulative_Patch/Manual_Install/
          retention-days: 7
          compression-level: 0
  setup-exe-windows:
    # Runs the Setup wizard unattended on Windows (Windows PowerShell 5.1, a standard runner account) over real
    # 23.3.35, 23.11.0 and 23.11.1 installations, checks the result, verifies, rolls back, refuses an unsupported version,
    # and runs the manual APPLY_PATCH.ps1 with Windows PowerShell 5.1.
    needs: setup-exe-build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        baseline: ["23.3.35:6d448fa", "23.11.1:8e8df0d", "23.12.0:fd5a117", "23.13.0:e0f9ac4", "23.13.1:0a7ed57", "23.13.2:89a6429", "23.13.3:9b42d1b", "23.14.0:18d9fde"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: SGQA-23.14.1-setup
          path: rel
      - name: Install the baseline release (its own code, a virtual environment, a database with data)
        shell: pwsh
        run: |
          $v, $c = "${{ matrix.baseline }}".Split(":")
          $inst = Join-Path $env:RUNNER_TEMP "inst"
          New-Item -ItemType Directory -Force "$inst\app", "$inst\data" | Out-Null
          # skyguard_agent exists from 23.5.0 on: archive only what the release has
          $parts = @(git ls-tree --name-only $c) | Where-Object { $_ -in @("qa_platform", "web", "skyguard_agent", "requirements.txt") }
          git archive --format=zip -o "$env:RUNNER_TEMP\rel.zip" $c @parts
          Expand-Archive "$env:RUNNER_TEMP\rel.zip" "$inst\app"
          '{"installed": true}' | Set-Content "$inst\app\INSTALLED.json"
          python -m venv "$inst\app\.venv"
          & "$inst\app\.venv\Scripts\python.exe" -m pip install -q -r "$inst\app\requirements.txt"
          $env:QA_HOME = "$inst\data"
          & "$inst\app\.venv\Scripts\python.exe" -c "import sys; sys.path.insert(0, r'$inst\app'); from qa_platform.config import Paths; from qa_platform.storage.db import Database; d = Database(Paths().ensure().db_file); print('installed', d.query_one('SELECT MAX(version) AS v FROM schema_version')['v']); d.close()"
          "INST=$inst" | Out-File -Append $env:GITHUB_ENV
          "BASEV=$v" | Out-File -Append $env:GITHUB_ENV
      - name: Setup.exe refuses a version that is not supported, and changes nothing
        shell: pwsh
        run: |
          $init = "$env:INST\app\qa_platform\__init__.py"
          $orig = Get-Content $init -Raw
          ($orig -replace '__version__ = "[^"]+"', '__version__ = "23.3.31"') | Set-Content $init -NoNewline
          $exe = Get-ChildItem rel -Recurse -Filter "*Offline_Setup.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "/S", "/APP=$env:INST", "/NOSTART" -Wait -PassThru
          "exit code $($p.ExitCode)"
          if ($p.ExitCode -ne 3) { throw "expected exit code 3 (not supported), got $($p.ExitCode)" }
          if ((Get-Content $init -Raw) -notmatch '23.3.31') { throw "the version file was changed" }
          if (Test-Path "$env:INST\patch-backups") { throw "a backup was made for an unsupported version" }
          $orig | Set-Content $init -NoNewline
      - name: Setup.exe upgrades and verifies (unattended)
        shell: pwsh
        run: |
          $exe = Get-ChildItem rel -Recurse -Filter "*Offline_Setup.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "/S", "/APP=$env:INST", "/NOSTART" -Wait -PassThru
          Get-ChildItem "$env:INST\logs\setup-23.14.1-*.txt" | ForEach-Object { Get-Content $_.FullName }
          "exit code $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Setup failed with exit code $($p.ExitCode)" }
          if ((Get-Content "$env:INST\app\qa_platform\__init__.py" -Raw) -notmatch '"23.14.1"') { throw "version is not 23.14.1" }
          if (-not (Test-Path "$env:INST\patch-tools\23.14.1\ROLLBACK_PATCH.cmd")) { throw "patch-tools missing" }
          $env:QA_HOME = "$env:INST\data"
          & "$env:INST\app\.venv\Scripts\python.exe" -E -s "$env:INST\patch-tools\23.14.1\install_patch.py" verify --app "$env:INST" --python "$env:INST\app\.venv\Scripts\python.exe"
          if ($LASTEXITCODE -ne 0) { throw "verify failed" }
      - name: Roll back to the baseline, then upgrade again with APPLY_PATCH.ps1 (Windows PowerShell 5.1)
        shell: pwsh
        run: |
          $env:QA_HOME = "$env:INST\data"
          & "$env:INST\app\.venv\Scripts\python.exe" -E -s "$env:INST\patch-tools\23.14.1\install_patch.py" rollback --app "$env:INST" --skip-running-check
          if ($LASTEXITCODE -ne 0) { throw "rollback failed" }
          if ((Get-Content "$env:INST\app\qa_platform\__init__.py" -Raw) -notmatch [regex]::Escape("""$env:BASEV""")) { throw "rollback did not restore $env:BASEV" }
          $manual = Get-ChildItem rel -Recurse -Directory -Filter "Manual_Install" | Select-Object -First 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$($manual.FullName)\APPLY_PATCH.ps1" -InstallDir "$env:INST" -NoStart
          if ($LASTEXITCODE -ne 0) { throw "APPLY_PATCH.ps1 failed" }
          if ((Get-Content "$env:INST\app\qa_platform\__init__.py" -Raw) -notmatch '"23.14.1"') { throw "version is not 23.14.1 after APPLY_PATCH.ps1" }
      - name: INSTALL_SPEECH_MODEL.cmd installs a model zip offline (Windows PowerShell 5.1)
        shell: pwsh
        run: |
          $app = "$env:INST\app"
          foreach ($f in "INSTALL_SPEECH_MODEL.cmd", "INSTALL_SPEECH_MODEL.ps1", "GET_FASTER_WHISPER_MODEL.ps1") {
            if (-not (Test-Path "$app\$f")) { throw "$f is not in the application folder" } }
          $src = Join-Path $env:RUNNER_TEMP "faster-whisper-small"
          New-Item -ItemType Directory -Force $src | Out-Null
          foreach ($f in "model.bin", "config.json", "tokenizer.json", "vocabulary.txt") { "x" | Set-Content "$src\$f" }
          Compress-Archive -Path "$src\*" -DestinationPath "$src.zip" -Force
          $env:QA_NO_PAUSE = "1"
          cmd /c "`"$app\INSTALL_SPEECH_MODEL.cmd`" `"$src.zip`""
          if ($LASTEXITCODE -ne 0) { throw "INSTALL_SPEECH_MODEL.cmd failed" }
          $dest = @("$app\runtime\faster-whisper\models\small", "$env:INST\runtime\faster-whisper\models\small") | Where-Object { Test-Path "$_\model.bin" } | Select-Object -First 1
          if (-not $dest) { throw "the model was not installed" }
          "installed in $dest"
          # a zip without a model is refused and changes nothing
          Compress-Archive -Path "$src\config.json" -DestinationPath "$env:RUNNER_TEMP\faster-whisper-bad.zip" -Force
          cmd /c "`"$app\INSTALL_SPEECH_MODEL.cmd`" `"$env:RUNNER_TEMP\faster-whisper-bad.zip`""
          if ($LASTEXITCODE -eq 0) { throw "a zip without a model was accepted" }
          if (Test-Path ($dest -replace 'small$', 'bad')) { throw "a model folder was made for the bad zip" }
          exit 0  # the refused zip above left exit code 1 behind on purpose
      - name: Arabic voice replies offline (GET_ARABIC_VOICE.ps1, INSTALL_ARABIC_VOICE.cmd, Piper renders Arabic)
        shell: pwsh
        run: |
          $app = "$env:INST\app"
          foreach ($f in "INSTALL_ARABIC_VOICE.cmd", "INSTALL_ARABIC_VOICE.ps1", "GET_ARABIC_VOICE.ps1") {
            if (-not (Test-Path "$app\$f")) { throw "$f is not in the application folder" } }
          # the internet PC step (this runner has Internet): Piper (pinned SHA-256) + ar_JO-kareem-medium (HF SHA-256)
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$app\GET_ARABIC_VOICE.ps1" -OutDir "$env:RUNNER_TEMP\usb"
          if ($LASTEXITCODE -ne 0) { throw "GET_ARABIC_VOICE.ps1 failed" }
          # the office PC step: install from the zip, offline
          $env:QA_NO_PAUSE = "1"
          cmd /c "`"$app\INSTALL_ARABIC_VOICE.cmd`" `"$env:RUNNER_TEMP\usb\skyguard-arabic-voice.zip`""
          if ($LASTEXITCODE -ne 0) { throw "INSTALL_ARABIC_VOICE.cmd failed" }
          if (-not (Test-Path "$app\runtime\piper\piper.exe")) { throw "piper.exe was not installed" }
          if (-not (Test-Path "$app\runtime\piper\voices\ar_JO-kareem-medium.onnx")) { throw "the Arabic voice was not installed" }
          # SkyGuard QA speaks an Arabic reply with it (the runner has only English Windows voices, like the office PC)
          $py = @'
          import sys, tempfile
          from pathlib import Path
          from qa_platform.voice.tts import SystemVoice
          sv = SystemVoice(Path(tempfile.mkdtemp()) / "voice-cache")
          print("arabic:", sv.arabic_status())
          assert sv.arabic_status()["engine"] in ("piper", "windows"), sv.arabic_status()
          wav = sv.render("\u062a\u0645. \u062c\u0627\u0631\u064a \u0641\u062a\u062d \u0627\u0644\u0635\u0641\u062d\u0629.")
          assert wav[:4] == b"RIFF" and len(wav) > 8000, len(wav)
          print("Arabic reply rendered:", len(wav), "bytes")
          import io, wave
          male = wave.open(io.BytesIO(wav)).getframerate()
          female = sv.render("\u062d\u0627\u0636\u0631.", gender="female")
          print("female:", sv.arabic_status(gender="female")["female"], wave.open(io.BytesIO(female)).getframerate())
          assert female[:4] == b"RIFF" and wave.open(io.BytesIO(female)).getframerate() > male
          print("voices seen by SkyGuard QA:", sv.voices())
          '@
          $env:QA_HOME = "$env:INST\data"
          Push-Location $app
          $py | & "$app\.venv\Scripts\python.exe" -E -s -
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { throw "the Arabic reply was not rendered" }
  extension-install-windows:
    # 1.2.0 installer fix: runs the companion installer (Install-SkyGuardAgent.ps1) for real under Windows
    # PowerShell 5.1 on a brand-new per-user profile. First the script as released in 23.10.0 (expected to fail with
    # "Could not find a part of the path", as reported on Windows 10 1909), then the fixed script: a new
    # installation, the companion answering on 127.0.0.1, and a second run over the existing installation.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the extension package with the released 23.10.0 installer, then with the fixed one
        shell: bash
        run: |
          cp browser-extension/scripts/Install-SkyGuardAgent.ps1 /tmp/fixed.ps1
          git show 8c8dcc4:browser-extension/scripts/Install-SkyGuardAgent.ps1 > browser-extension/scripts/Install-SkyGuardAgent.ps1
          python packaging/browser-extension/build_extension.py --out ext-old --cache ext-cache
          cp /tmp/fixed.ps1 browser-extension/scripts/Install-SkyGuardAgent.ps1
          git diff --exit-code browser-extension/scripts/Install-SkyGuardAgent.ps1
          python packaging/browser-extension/build_extension.py --out ext-new --cache ext-cache
      - name: The released installer fails on a new installation (reproduction)
        shell: powershell
        run: |
          $env:LOCALAPPDATA = "C:\sg-old\Local"; New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $s = Get-ChildItem ext-old -Recurse -Filter Install-SkyGuardAgent.ps1 | Select-Object -First 1
          $out = powershell.exe -NoProfile -ExecutionPolicy Bypass -File $s.FullName -NoStart -NoAutostart 2>&1 | Out-String
          $rc = $LASTEXITCODE
          $out
          "exit code $rc"
          if ($rc -ne 1 -or $out -notmatch "Could not find a part of the path") { throw "the released installer did not fail as reported" }
          "Reproduced: the released installer fails exactly as reported."
          exit 0
      - name: The fixed installer installs on a new profile (TEMP on another drive) and the companion answers
        shell: powershell
        run: |
          $env:LOCALAPPDATA = "C:\sg-new\Local"; New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $env:TEMP = "D:\sg-temp"; $env:TMP = $env:TEMP; New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
          $s = Get-ChildItem ext-new -Recurse -Filter Install-SkyGuardAgent.ps1 | Select-Object -First 1
          $out = powershell.exe -NoProfile -ExecutionPolicy Bypass -File $s.FullName -NoAutostart 2>&1 | Out-String
          $rc = $LASTEXITCODE
          $out
          "exit code $rc"
          if ($rc -ne 0) { throw "installation failed" }
          if ($out -notmatch "New installation") { throw "not a new installation" }
          if ($out -notmatch "answers on http://127.0.0.1:8790") { throw "the companion did not answer" }
          foreach ($f in @("runtime\python\python.exe", "runtime\llama\llama-server.exe", "app\companion_main.py", "extension\manifest.json")) {
            if (-not (Test-Path "$env:LOCALAPPDATA\SkyGuardAgent\$f")) { throw "$f missing" }
          }
          if (Get-ChildItem "$env:LOCALAPPDATA\SkyGuardAgent\runtime" -Filter "staging-*") { throw "staging folder left behind" }
          # 1.4.0: the extension sets itself up (no pairing code, no sign-in): the one-time ticket is in its folder
          $auto = Get-Content "$env:LOCALAPPDATA\SkyGuardAgent\extension\auto-setup.json" -Raw | ConvertFrom-Json
          if (-not $auto.ticket -or $auto.port -ne 8790) { throw "auto-setup.json has no ticket" }
          if ($out -notmatch "pair and sign in by itself") { throw "the automatic set-up was not prepared" }
      - name: The fixed installer runs again over the existing installation
        shell: powershell
        run: |
          $env:LOCALAPPDATA = "C:\sg-new\Local"
          $s = Get-ChildItem ext-new -Recurse -Filter Install-SkyGuardAgent.ps1 | Select-Object -First 1
          $out = powershell.exe -NoProfile -ExecutionPolicy Bypass -File $s.FullName -NoAutostart 2>&1 | Out-String
          $rc = $LASTEXITCODE
          $out
          "exit code $rc"
          if ($rc -ne 0) { throw "re-installation failed" }
          if ($out -notmatch "Previous program files saved") { throw "the earlier installation was not backed up" }
          if ($out -notmatch "answers on http://127.0.0.1:8790") { throw "the companion did not answer" }
          Get-Process pythonw, python -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "C:\sg-*" } | Stop-Process -Force
