name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium for Playwright tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then python -m playwright install --with-deps chromium; else python -m playwright install chromium; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install JMeter for performance tests (checksum verified)
        shell: bash
        run: |
          v=5.6.3
          # archive.apache.org often resets or times out from the runners: retry, then try the Apache CDN
          fetch() {
            for base in https://archive.apache.org/dist https://dlcdn.apache.org; do
              curl -sSfL --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 30 -o "$2" "$base/jmeter/binaries/$1" && return 0
            done
            return 1
          }
          fetch "apache-jmeter-$v.tgz" jmeter.tgz
          fetch "apache-jmeter-$v.tgz.sha512" jmeter.sha512
          echo "$(cut -d' ' -f1 jmeter.sha512)  jmeter.tgz" | sha512sum -c -
          dest="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")"  # Git Bash tar reads "D:" as a remote host
          tar -xzf jmeter.tgz -C "$dest"
          echo "JMETER_HOME=$RUNNER_TEMP/apache-jmeter-$v" >> "$GITHUB_ENV"
      - run: python -m pytest -q
  security-audit:
    # Fails the build when a bundled Python package has a known vulnerability (PyPI advisory database / OSV),
    # before the package reaches a company security scan.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit the exact packages bundled in the offline package
        run: pip-audit --strict --no-deps --disable-pip -r packaging/requirements-offline-win.txt
      - name: Audit the Faster-Whisper packages bundled in the offline package
        run: pip-audit --strict --no-deps --disable-pip -r packaging/requirements-faster-whisper-win.txt
  offline-package:
    # Builds the portable package exactly as a user would, validates it with the network blocked,
    # installs it per-user (no administrator rights) and validates the installed copy.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: dist_offline/downloads
          key: offline-downloads-${{ hashFiles('packaging/offline-lock.json') }}
      - name: Build the offline package (validates it at the end)
        env:
          QA_NO_PAUSE: "1"
        run: python packaging/build_offline_package.py --zip
      - name: Install to a temporary folder and validate the installed copy
        shell: cmd
        env:
          QA_NO_PAUSE: "1"
        run: |
          for /d %%P in (dist_offline\SGQA) do set "PKG=%%P"
          call "%PKG%\INSTALL.cmd" --target "%RUNNER_TEMP%\qa-install" --no-shortcuts || exit /b 1
          call "%RUNNER_TEMP%\qa-install\VALIDATE_OFFLINE.cmd" || exit /b 1
          type "%RUNNER_TEMP%\qa-install\logs\validation-latest.txt"
      - name: Publish the package for download (Actions run page, Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: SGQA-windows
          path: dist_offline/SGQA/
          retention-days: 14
          compression-level: 6
          # Bundled JMeter and Python packages contain dot-files that MANIFEST.json lists; without them the
          # installer rightly reports the package as damaged.
          include-hidden-files: true
      - name: Publish the zip, its checksum and the SBOM (hand these to the security team)
        uses: actions/upload-artifact@v4
        with:
          name: SGQA-windows-zip
          path: |
            dist_offline/SGQA-*.zip
            dist_offline/SHA256SUMS.txt
            dist_offline/SGQA/sbom.cdx.json
          retention-days: 14
          compression-level: 0
  offline-package-download:
    # Proves the artifact people download installs: fetch it the way a user would, on a fresh runner, then
    # validate and install it.
    needs: offline-package
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SGQA-windows
          path: downloaded/SGQA
      - name: Validate and install the downloaded package
        shell: cmd
        env:
          QA_NO_PAUSE: "1"
        run: |
          rem The artifact holds the contents of the SGQA folder, as a user sees it after Extract All.
          for /d %%P in ("%CD%\downloaded\SGQA") do set "PKG=%%~fP"
          if not defined PKG (echo No package folder in the download & dir /b downloaded & exit /b 1)
          call "%PKG%\VALIDATE.cmd" || exit /b 1
          call "%PKG%\INSTALL.cmd" --target "%RUNNER_TEMP%\qa-install" --no-shortcuts || exit /b 1
          type "%RUNNER_TEMP%\qa-install\logs\validation-latest.txt"
