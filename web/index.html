<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Agentic Test Agent Enterprise</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem("qa.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="img/favicon.svg" alt="" width="28" height="28">
        <div>
          <div class="brand-title">AI Agentic Test Agent</div>
          <div class="brand-sub">Enterprise</div>
        </div>
      </div>
      <nav id="nav" aria-label="Main navigation"></nav>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle navigation">&#9776;</button>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="topbar-actions">
          <span class="conn" id="connState" title="Live runtime connection">Connecting</span>
          <div class="bell-wrap">
            <button class="icon-btn" id="voiceBtn" aria-label="Speak a command" title="Voice command"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12Z"/></svg></button>
            <div class="popover voice-pop" id="voicePop" hidden aria-live="polite"></div>
          </div>
          <button class="icon-btn" id="themeBtn" aria-label="Toggle light or dark theme" title="Toggle theme"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9A9 9 0 0 0 12 3Zm0 16V5a7 7 0 0 1 0 14Z"/></svg></button>
          <div class="bell-wrap">
            <button class="icon-btn" id="bellBtn" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3a1.5 1.5 0 0 0-3 0v1.16A7 7 0 0 0 5 11v5l-2 2v1h18v-1Z"/></svg>
              <span class="badge" id="unreadBadge" hidden>0</span>
            </button>
            <div class="popover" id="bellPopover" hidden>
              <div class="popover-head">
                <strong>Notifications</strong>
                <button class="link-btn" id="markAllRead">Mark all read</button>
              </div>
              <ul class="note-list" id="bellList"></ul>
              <a class="popover-foot" href="#/notifications">View all</a>
            </div>
          </div>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <div class="toast-host" id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
