<!doctype html><html><head><meta charset="utf-8"><title>Products</title></head><body>
<div id="app">Loading…</div>
<script>
setTimeout(() => {
  document.getElementById("app").innerHTML = `
    <label for="cat">Category</label><select id="cat"><option>Select a category</option><option>Books</option><option>Electronics</option></select>
    <label for="pn">Product name</label><input id="pn">
    <label for="co">Country</label><select id="co"><option>Choose...</option><option>Canada</option><option>United States</option></select>
    <label for="zip">ZIP code</label><input id="zip">
    <label><input type="checkbox" id="gift"> Gift wrap</label>
    <label><input type="radio" name="ship" value="std"> Standard shipping</label>
    <label><input type="radio" name="ship" value="exp"> Express shipping</label>
    <button id="save" type="button">Save</button><div id="msg"></div>`;
  document.getElementById("save").onclick = () => setTimeout(() => {
    const m = document.getElementById("msg");
    m.className = "confirmation"; m.setAttribute("role", "status");
    m.textContent = "Product " + document.getElementById("pn").value + " saved.";
  }, 500);
}, 600);
</script></body></html>
