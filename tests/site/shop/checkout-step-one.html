<!doctype html>
<html><head><meta charset="utf-8"><title>Test Shop</title><script src="common.js"></script></head>
<body>
<script>shop.guard();</script>
<span class="title" data-test="title">Checkout: Your Information</span>
<form class="checkout_info" onsubmit="return false">
  <input placeholder="First Name" id="first-name" name="firstName" data-test="firstName" required>
  <input placeholder="Last Name" id="last-name" name="lastName" data-test="lastName" required>
  <input placeholder="Zip/Postal Code" id="postal-code" name="postalCode" data-test="postalCode" required>
  <button type="button" id="cancel" data-test="cancel">Cancel</button>
  <input type="submit" id="continue" data-test="continue" value="Continue">
</form>
<script>
  shop.header();
  document.getElementById("cancel").onclick = () => shop.go("cart.html");
  document.getElementById("continue").onclick = () => shop.go("checkout-step-two.html");
</script>
</body></html>
