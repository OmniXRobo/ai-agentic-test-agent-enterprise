<!doctype html>
<html><head><meta charset="utf-8"><title>Two-Factor Authentication</title></head>
<body>
<h2>Two-Factor Authentication</h2>
<form onsubmit="return false">
  <label for="code">Authentication Code</label>
  <input id="code" name="code" autocomplete="one-time-code" required>
  <button type="submit" id="verify">Verify</button>
  <p id="err" role="alert"></p>
</form>
<script>
  document.getElementById("verify").onclick = () => {
    if (document.getElementById("code").value !== "123456") { document.getElementById("err").textContent = "Invalid code"; return; }
    localStorage.setItem("shop_user", sessionStorage.getItem("pending") || "mfa_user");
    location.href = "inventory.html";
  };
</script>
</body></html>
