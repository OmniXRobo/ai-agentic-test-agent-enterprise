<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in</title></head>
<body>
<a href="index.html">Home</a>
<form id="login" onsubmit="return false">
  <label for="username">Username</label>
  <input id="username" name="username" placeholder="Your user name">
  <label for="password">Password</label>
  <input id="password" name="password" type="password">
  <label for="region">Region</label>
  <select id="region" name="region"><option value="eu">Europe</option><option value="me">Middle East</option></select>
  <label><input type="checkbox" id="remember" name="remember"> Remember me</label>
  <label for="travel">Travel date</label>
  <input id="travel" name="travel">
  <button type="button" class="btn secondary" id="cancel-btn">Cancel</button>
  <button type="button" class="btn main" id="signin-btn">Sign in</button>
</form>
<p id="welcome" hidden></p>
<script>
  document.getElementById("signin-btn").addEventListener("click", async () => {
    const ok = document.getElementById("password").value === "s3cret-pass";
    const msg = document.getElementById("welcome");
    msg.hidden = false;
    msg.textContent = ok ? `Welcome ${document.getElementById("username").value} on ${document.getElementById("travel").value}` : "Invalid credentials";
    await fetch("api/items/42");
  });
</script>
</body></html>
