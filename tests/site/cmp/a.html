<!doctype html><html><head><meta charset="utf-8"><title>Finance System A</title><script src="data.js"></script></head>
<body><form id="login"><label>User <input id="user" name="username"></label><label>Password <input id="pass" type="password"></label>
<button type="submit">Sign in</button><span id="err"></span></form>
<div id="app" hidden><h1>Invoices</h1>
<label>Start Date <input id="from" value=""></label>
<table id="inv"><thead><tr><th>Invoice No</th><th>Customer Name</th><th>Invoice Amount</th><th>Status</th><th>Invoice Date</th></tr></thead><tbody></tbody></table>
<div id="info"></div><button id="prev">Previous</button><button id="next">Next</button></div>
<script>
const codes = { Paid: '1', Pending: '2' };
login(() => pager(invoices(), 20, (rows) => {
  document.querySelector('#inv tbody').innerHTML = rows.map(r => `<tr><td>${r.id}</td><td>${r.customer.toUpperCase()}</td>` +
    `<td>AED ${fmt(r.amount)}</td><td>${codes[r.status]}</td><td>${String(r.day).padStart(2, '0')}/${String(r.month).padStart(2, '0')}/2026</td></tr>`).join('');
}));
</script></body></html>
