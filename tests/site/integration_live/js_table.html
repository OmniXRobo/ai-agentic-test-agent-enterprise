<!doctype html><html><head><meta charset="utf-8"><title>Invoices (JavaScript table)</title>
<style>body{font-family:Arial;margin:20px}td,th{border:1px solid #ccc;padding:4px 8px}.loading{color:#888}</style></head>
<body><h2>Invoices</h2><div id="status" class="loading" aria-busy="true">Loading…</div><div id="host"></div>
<div id="pager"></div>
<script>
// the table library comes from another host (as from a CDN): blocked by the 23.8.0 request rule
const s = document.createElement("script");
s.src = location.protocol + "//localhost:" + location.port + "/integration_live/data.js";
s.onload = () => setTimeout(() => { page = 0; draw(); document.getElementById("status").remove(); }, 700);
document.head.appendChild(s);
let page = 0; const size = 10;
function draw() {
  const rows = INVOICES.slice(page * size, page * size + size);
  document.getElementById("host").innerHTML = "<table id='inv'><thead><tr><th>Invoice No</th><th>Customer</th><th>City</th><th>Status</th><th>Amount (AED)</th></tr></thead><tbody>" +
    rows.map(r => `<tr><td>${r.id}</td><td>${r.customer}</td><td>${r.city}</td><td>${r.status}</td><td>${fmt(r.amount)}</td></tr>`).join("") + "</tbody></table>";
  const last = (page + 1) * size >= INVOICES.length;
  document.getElementById("pager").innerHTML = `Showing ${page * size + 1} to ${Math.min(INVOICES.length, page * size + size)} of ${INVOICES.length} entries
    <button id="next" ${last ? "disabled" : ""} onclick="page++; setTimeout(draw, 300)">Next</button>`;
}
</script></body></html>
