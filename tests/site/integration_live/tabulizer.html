<!doctype html><html><head><meta charset="utf-8"><title>Sorting, pagination, filtering (stand-in)</title>
<style>body{font-family:Arial;margin:20px}td,th{border:1px solid #ccc;padding:4px 8px}.pg a{margin:0 3px}</style></head>
<body><h2>Invoices</h2>
<!-- 23.12.0 stand-in for a table plug-in like the tabulizer.com demo: "Show N entries", a Search box that filters as
     you type (no Apply button), page numbers, and a Next link that stays active on the last page.
     ?wrap=1: Next on the last page goes back to page 1.  ?count=1: the page says "Showing x to y of N entries". -->
<label>Show <select id="size"><option>10</option><option>25</option><option>50</option><option>100</option></select> entries</label>
<label style="margin-left:30px">Search: <input id="q" type="text"></label>
<div id="host"></div><div id="info"></div><div class="pg" id="pager"></div>
<script src="data.js"></script>
<script>
const qs = new URLSearchParams(location.search);
let page = 0;
const size = () => Number(document.getElementById("size").value);
const rows = () => { const q = document.getElementById("q").value.trim().toLowerCase();
  return INVOICES.filter(r => !q || Object.values(r).some(v => String(v).toLowerCase().includes(q))); };
function draw() {
  const all = rows(), pages = Math.max(1, Math.ceil(all.length / size()));
  page = Math.min(page, pages - 1);
  const shown = all.slice(page * size(), page * size() + size());
  document.getElementById("host").innerHTML = "<table id='inv'><thead><tr><th>Invoice No</th><th>Customer</th><th>City</th><th>Status</th><th>Amount (AED)</th></tr></thead><tbody>" +
    shown.map(r => `<tr><td>${r.id}</td><td>${r.customer}</td><td>${r.city}</td><td>${r.status}</td><td>${fmt(r.amount)}</td></tr>`).join("") + "</tbody></table>";
  document.getElementById("info").textContent = qs.get("count") ? `Showing ${page * size() + 1} to ${page * size() + shown.length} of ${all.length} entries` : "";
  let h = '<a href="#" data-p="0">First</a><a href="#" data-p="prev">Prev</a>';
  for (let i = 0; i < pages; i++) h += `<a href="#" data-p="${i}">${i + 1}</a>`;
  h += '<a href="#" data-p="next">Next</a><a href="#" data-p="last">Last</a>';
  document.getElementById("pager").innerHTML = h;
}
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-p]"); if (!a) return; e.preventDefault();
  const pages = Math.max(1, Math.ceil(rows().length / size())), p = a.dataset.p;
  if (p === "next") page = page + 1 < pages ? page + 1 : (qs.get("wrap") ? 0 : page);
  else if (p === "prev") page = Math.max(0, page - 1);
  else if (p === "last") page = pages - 1;
  else page = Number(p);
  setTimeout(draw, 150);
});
document.getElementById("q").addEventListener("input", () => { page = 0; draw(); });
document.getElementById("size").addEventListener("change", () => { page = 0; draw(); });
draw();
</script></body></html>
