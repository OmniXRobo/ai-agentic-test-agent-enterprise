<!doctype html><html><head><meta charset="utf-8"><title>DataTables-style table</title><script src="data.js"></script></head>
<body><h2>Invoices</h2><table id="dt"><thead><tr><th>Invoice No</th><th>City</th><th>Amount</th></tr></thead><tbody></tbody></table>
<div>Showing 1 to 5 of 25 entries</div>
<script>
// A minimal stand-in with the DataTables API surface the extractor uses (jQuery.fn.dataTable.isDataTable,
// DataTable().rows({search}).every, cell().render('display'), columns().header(), settings()[0].oFeatures).
// Only the first 5 rows are drawn: the API holds all 25.
(function () {
  const data = INVOICES.map(r => [r.id, "<b>" + r.city + "</b>", fmt(r.amount)]);
  const t = document.getElementById("dt");
  t.tBodies[0].innerHTML = data.slice(0, 5).map(r => "<tr>" + r.map(c => "<td>" + c + "</td>").join("") + "</tr>").join("");
  const api = {
    settings: () => [{oFeatures: {bServerSide: false}}],
    columns: () => ({header: () => ({toArray: () => [...t.tHead.rows[0].cells]})}),
    rows: () => ({every: (fn) => data.forEach((_, i) => fn.call({index: () => i}))}),
    cell: (r, c) => ({render: () => data[r][c]}),
  };
  const $ = (el) => ({DataTable: () => api});
  $.fn = {dataTable: {isDataTable: (el) => el === t}};
  window.jQuery = $;
})();
</script></body></html>
