<!doctype html><html><head><meta charset="utf-8"><script src="data.js"></script></head><body>
<table id="t"><thead><tr><th rowspan="2">Invoice No</th><th colspan="2">Billing</th><th rowspan="2">Amount</th></tr><tr><th>City</th><th>Status</th></tr></thead><tbody></tbody>
<tfoot><tr><td>Total</td><td></td><td></td><td id="tot"></td></tr></tfoot></table>
<script>
const rows = INVOICES.slice(0, 12);
document.querySelector("#t tbody").innerHTML = rows.map(r => `<tr><th scope="row">${r.id}</th><td>${r.city}</td><td>${r.status}</td><td>${fmt(r.amount)}</td></tr>`).join("");
document.getElementById("tot").textContent = fmt(rows.reduce((a, r) => a + Number(r.amount), 0));
</script></body></html>
