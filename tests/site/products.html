<!doctype html>
<html><head><meta charset="utf-8"><title>Products</title></head>
<body>
<a href="index.html">Home</a>
<input type="search" aria-label="Search products" placeholder="Search">
<ul id="list"></ul>
<script>
  Promise.all([fetch("api/items/7"), fetch("api/items/8")]).then(rs => Promise.all(rs.map(r => r.json()))).then(items => {
    document.getElementById("list").innerHTML = items.map(i => `<li>${i.name}</li>`).join("");
  });
</script>
</body></html>
