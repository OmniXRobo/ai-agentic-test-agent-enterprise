[pytest]
# AI-Driven Automation framework (Python + Playwright + Page Object Model).
# Paths are relative to this folder, so the workspace runs from any folder on any PC.
pythonpath = .
testpaths = tests
addopts = -p no:cacheprovider
markers =
    test_case(id): TFS Test Case automated by the test
    user_story(id): TFS User Story the Test Case belongs to
    acceptance_criteria(*ids): Acceptance Criteria covered by the test
    test_data(name): data file in test_data/ (one run per combination)
